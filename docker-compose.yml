version: "3.8"
services:
  api:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npx prisma generate && node src/main.js"
    ports:
      - "3001:3000"
    depends_on:
      - db

  web:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: hrflow
      POSTGRES_DB: hrflow
    ports:
      - "5432:5432"